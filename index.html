<!doctype html>
<html lang="en">
<head>
<!--HEAD-START-->
<title>Shubham Rai Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Shubham Rai — Full Stack Developer building smart digital experiences with MERN, Shopify and low-code tools.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap">
<!--HEAD-END-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--BODY-START-->
<!-- Preloader: word sequence, then identity lockup -->
<div id="preloader" class="preloader" aria-hidden="true">
  <div class="pl-stage" id="pl-word-stage">
    <div class="pl-mask"><div class="pl-word"></div></div>
  </div>
  <div class="pl-identity" id="pl-identity">
    <div class="pl-id-name" data-pl-name></div>
    <div class="pl-id-rule"></div>
    <div class="pl-mask"><p class="pl-id-sub mono" data-pl-sub></p></div>
  </div>
</div>

<!-- Fixed navigation (difference blend keeps it readable on light and dark panels) -->
<header class="nav" id="nav">
  <a href="#home" class="nav-logo" data-link data-cursor="nav" aria-label="Home"><span data-scramble data-logo></span></a>
  <nav class="nav-links" aria-label="Primary">
    <a href="#work" data-link data-cursor="nav" data-glitch data-route="work"><span data-scramble>Work</span><span class="u-line"></span></a>
    <a href="#about" data-link data-cursor="nav" data-glitch data-route="about"><span data-scramble>About</span><span class="u-line"></span></a>
    <a href="#contact" data-link data-cursor="nav" data-glitch data-route="contact"><span data-scramble>Contact</span><span class="u-line"></span></a>
  </nav>
  <div class="nav-right">
    <p class="nav-clock mono" data-clock></p>
    <a class="nav-resume mono" href="assets/Shubham-Rai-Resume.pdf" download="Shubham-Rai-Resume.pdf" target="_blank" rel="noopener" data-resume data-cursor="nav"><span>Resume</span><span class="nav-resume-icon" aria-hidden="true">↓</span></a>
    <button class="nav-toggle mono" id="menuToggle" aria-expanded="false" aria-controls="menu">Menu</button>
  </div>
</header>

<!-- Mobile menu -->
<div class="menu" id="menu" hidden>
  <ul class="menu-list">
    <li><div class="m-mask"><a href="#home" data-link>Home</a></div></li>
    <li><div class="m-mask"><a href="#work" data-link>Work</a></div></li>
    <li><div class="m-mask"><a href="#about" data-link>About</a></div></li>
    <li><div class="m-mask"><a href="#contact" data-link>Contact</a></div></li>
  </ul>
  <a class="pill menu-resume" href="assets/Shubham-Rai-Resume.pdf" download="Shubham-Rai-Resume.pdf" target="_blank" rel="noopener" data-resume>Download resume ↓</a>
  <p class="mono menu-foot" data-clock></p>
</div>

<!-- Views are rendered here by main.js -->
<main id="app"></main>

<!-- Scroll progress -->
<div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>

<!-- SVG path page transition -->
<div class="transition" id="transition" aria-hidden="true">
  <svg viewBox="0 0 100 100" preserveAspectRatio="none"><path id="tPath" d="M 0 100 V 100 Q 50 100 100 100 V 100 z"/></svg>
  <div class="t-stage">
    <div class="t-mask"><span class="t-label" id="tLabel"></span></div>
    <div class="t-rule" id="tRule"></div>
  </div>
</div>

<!-- Fluid ink trail + custom cursor -->
<canvas id="fluid" class="fluid" aria-hidden="true"></canvas>
<div class="cursor" aria-hidden="true"><div class="cursor-circle"></div><div class="cursor-dot"></div></div>
<div class="cursor-label" aria-hidden="true"><span></span></div>

<!-- Displacement filter used by link hovers -->
<svg class="filters" width="0" height="0" aria-hidden="true" focusable="false">
  <filter id="glitch-filter" x="-10%" y="-60%" width="120%" height="220%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015 0.9" numOctaves="1" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<noscript><div class="noscript">This site needs JavaScript for its motion. Turn it on to see the work.</div></noscript>
<!--BODY-END-->

<!--SCRIPTS-START-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Draggable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/InertiaPlugin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/EasePack.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<!--SCRIPTS-END-->
<script src="main.js"></script>
</body>
</html>
